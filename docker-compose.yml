services:
  n8n-dev:
    image: n8nio/n8n:1.108.1
    ports:
      - "5679:5678"  # Port local différent pour dev
    environment:
      - N8N_DEFAULT_LOCALE=fr
      - N8N_USER_MANAGEMENT_DISABLED=false
      - N8N_AUTH_EXCLUDE_ENDPOINTS=none
      - N8N_HOST=dev.atm.pharmania.fr
      - N8N_PORT=5678
      - WEBHOOK_URL=https://dev.atm.pharmania.fr/
    volumes:
      - n8n_dev_data:/home/node/.n8n
    labels:
      - "coolify.domain=dev.atm.pharmania.fr"
      - "coolify.ssl=true"

volumes:
  n8n_dev_data:
