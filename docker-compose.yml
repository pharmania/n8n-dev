services:
  n8n-dev:
    image: n8nio/n8n:1.100.1
    ports:
      - "5679:5678" # port différent si tu veux le tester localement
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=dev.atm.pharmania.fr
      - N8N_PORT=5678
      - WEBHOOK_URL=https://dev.atm.pharmania.fr/
    volumes:
      - n8n_dev_data:/home/node/.n8n
    labels:
      - "coolify.domain=dev.atm.pharmania.fr"
      - "coolify.ssl=true"

volumes:
  n8n_dev_data:
